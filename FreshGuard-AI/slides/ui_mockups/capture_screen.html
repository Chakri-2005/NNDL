<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=1.0">
    <title>FreshGuard AI - Capture Screen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: white; display: flex; justify-content: center; height: 100vh; align-items: center; }
        .app-container { width: 375px; height: 812px; background: #000; position: relative; border-radius: 40px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .camera-view { width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1560806887-1e4cd0b6fac6?auto=format&fit=crop&w=375&q=80') center/cover; position: absolute; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .title { font-weight: 600; font-size: 18px; }
        .scan-frame { flex: 1; border: 2px dashed rgba(255, 255, 255, 0.5); margin: 60px 20px; border-radius: 20px; position: relative; }
        .scan-line { position: absolute; top: 30%; left: 0; right: 0; height: 2px; background: #2ea043; box-shadow: 0 0 10px #2ea043; animation: scan 2s infinite alternate; }
        @keyframes scan { 0% { top: 10%; } 100% { top: 90%; } }
        .footer { display: flex; justify-content: center; padding-bottom: 20px; }
        .capture-btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 4px solid white; cursor: pointer; }
        .capture-btn-inner { width: 54px; height: 54px; background: white; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="camera-view"></div>
        <div class="overlay">
            <div class="header">
                <div>🔙</div>
                <div class="title">Scan Fruit</div>
                <div>⚙️</div>
            </div>
            <div class="scan-frame">
                <div class="scan-line"></div>
            </div>
            <div class="footer">
                <div class="capture-btn">
                    <div class="capture-btn-inner"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
